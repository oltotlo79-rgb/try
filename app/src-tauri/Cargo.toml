[package]
name = "seisakubutsu-irai"
version = "1.0.0"
description = "制作物依頼システム サンプル"
edition = "2021"

[lib]
name = "seisakubutsu_irai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
